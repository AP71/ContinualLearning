[project]
name = "reactnet"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "scipy>=1.18.1",
    "ipykernel>=7.4.0",
    "tqdm>=4.70.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
