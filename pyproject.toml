[project]
name = "reactnet"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "scipy",
    "ipykernel",
    "tqdm",
    "matplotlib",
    "numpy",
    "avalanche-lib",
]

[tool.uv]
override-dependencies = [
    "qpsolvers>=4.0.0",  # Sovrascrive qpsolvers[open-source-solvers] rimuovendo la dipendenza da proxsuite
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
torchaudio = { index = "pytorch-cu132" }